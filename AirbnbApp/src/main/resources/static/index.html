<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a AirBnb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">Clon de AirBnb</div>
</header>

<main class="container">
    <section class="auth-section">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="email" id="login-correo" placeholder="Correo" required>
            <input type="password" id="login-contrasenia" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
    </section>

    <section class="auth-section">
        <h2>Crear una Cuenta</h2>
        <form id="register-form">
            <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
            <input type="email" id="reg-correo" placeholder="Correo electrónico" required>
            <input type="text" id="reg-doc" placeholder="Documento de identidad" required>
            <input type="password" id="reg-contrasenia" placeholder="Contraseña" required>
            <input type="tel" id="reg-telefono" placeholder="Teléfono" required>
            <input type="hidden" id="reg-tipoUsuario" value="huesped">
            <button type="submit">Registrarse</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2025 Clon de AirBnb</p>
</footer>

<script src="script.js"></script>
</body>
</html>
